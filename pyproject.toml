[project]
name = "vpn-cookie"
version = "0.1.0"
description = "Extract a Cisco WebVPN cookie after browser login."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "fido2>=2.0.0",
    "platformdirs>=4.0.0",
    "playwright>=1.45.0",
    "typer>=0.12.0",
]

[project.scripts]
vpn-cookie = "vpn_cookie.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
